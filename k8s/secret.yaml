# replaced by a Secret generated from a vault/CI pipeline, never committed with real values.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secrets
  namespace: fiapgames
  labels:
    app: catalog-api
type: Opaque
stringData:
