# Isolated integration environment: random Compose project, ports and secrets.
# Started and removed by search.integration.mjs; never uses development volumes.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${TEST_PASSWORD:?generated by test runner}"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongodb:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: test-user
      RABBITMQ_DEFAULT_PASS: "${TEST_PASSWORD}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:2.19.4
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1::9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
  catalog-api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      sqlserver: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    environment:
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=search-tests;User Id=sa;Password=${TEST_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__Mongo: "mongodb://mongodb:27017"
      Mongo__Database: search-tests
      Redis__Connection: "redis:6379"
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: test-user
      RabbitMq__Password: "${TEST_PASSWORD}"
      Jwt__SecretKey: "${TEST_JWT}"
      OpenSearch__Url: "http://opensearch:9200"
      OpenSearch__IndexName: search-test-games
      OpenSearch__RetryIntervalSeconds: "2"
  kong:
    image: kong:3.9
    depends_on:
      - catalog-api
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_STALE_TTL: "5"
      KONG_LOG_LEVEL: error
      JWT_SECRET_KEY: "${TEST_JWT}"
    ports:
      - "127.0.0.1::8000"
    volumes:
      - ../../FiapGames.Orchestration/kong/kong.compose.yml:/config/kong.template.yml:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed -e "s|<JWT_SECRET_KEY>|$${JWT_SECRET_KEY}|g" \
          -e 's|<NEW_RELIC_LICENSE_KEY>|test-license-not-configured|g' \
          /config/kong.template.yml > /tmp/kong.yml
        exec /docker-entrypoint.sh kong docker-start
